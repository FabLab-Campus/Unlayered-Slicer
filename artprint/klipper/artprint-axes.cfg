# ArtPrint - axes for the G-code written by artprint/traducteur/unlayered_to_klipper.py
#
# DRAFT. To include from printer.cfg with: [include artprint-axes.cfg]
# Pins, steps and limits are placeholders (A_REMPLIR): fill them once the board and the
# motors are chosen. Needs a recent Klipper (MANUAL_STEPPER ... GCODE_AXIS=, 2025 or later).
#
# ArtPrint uses one motor per axis ("kinematics": "cartesian" in machine.json): the translator
# writes X Y Z in mm and B (head tilt) and C (bed rotation) in degrees, already compensated.
#
# Z can go below 0: when the head tilts, the gantry drops so that the nozzle tip stays put.

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[stepper_x]
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40            # GT2 belt, 20-tooth pulley
endstop_pin: A_REMPLIR
position_endstop: 0
position_min: -200
position_max: 200

[stepper_y]
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40
endstop_pin: A_REMPLIR
position_endstop: 0
position_min: -200
position_max: 200

[stepper_z]
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 8             # A_REMPLIR: lead screw pitch
endstop_pin: probe:z_virtual_endstop
position_min: -60
position_max: 200

[manual_stepper motor_b]         # head tilt, units = degrees
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 120           # A_REMPLIR: 360 / gear reduction (here 3:1)
velocity: 90
accel: 1000

[manual_stepper motor_c]         # bed rotation, units = degrees
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 65.4545       # A_REMPLIR: 360 / gear reduction (here 5.5:1)
velocity: 180
accel: 2000

# Call once at the start of every print (from START_PRINT), after homing.
[gcode_macro ARTPRINT_AXES]
gcode:
    MANUAL_STEPPER STEPPER=motor_b ENABLE=1
    MANUAL_STEPPER STEPPER=motor_c ENABLE=1
    MANUAL_STEPPER STEPPER=motor_b GCODE_AXIS=B LIMIT_VELOCITY=90 LIMIT_ACCEL=1000
    MANUAL_STEPPER STEPPER=motor_c GCODE_AXIS=C LIMIT_VELOCITY=180 LIMIT_ACCEL=2000
