# ArtPrint - axes for the G-code written by artprint/traducteur/unlayered_to_klipper.py
#
# DRAFT. To include from printer.cfg with: [include artprint-axes.cfg]
# Pins, steps and limits are placeholders (A_REMPLIR): fill them once the board and the
# motors are chosen. Needs a recent Klipper (MANUAL_STEPPER ... GCODE_AXIS=, 2025 or later).
#
# With "kinematics": "corexbyc" in machine.json the five output axes are MOTORS, not tool axes:
#   X = motor 0 (X/B pair), Y = motor 1 (Y/C pair), Z = motor 2,
#   U = motor 3 (X/B pair), V = motor 4 (Y/C pair)
# so Klipper's own "cartesian" kinematics just moves each motor where the translator says.
# With "kinematics": "cartesian" they are X Y Z and the two rotary axes (set output_axes to
# ["X","Y","Z","B","C"] and rename the GCODE_AXIS letters below to B and C).
#
# Z can go below 0: when the head tilts, the gantry drops so that the nozzle tip stays put.

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100

[stepper_x]                      # motor 0
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40            # GT2 belt, 20-tooth pulley
endstop_pin: A_REMPLIR
position_endstop: 0
position_min: -200
position_max: 200

[stepper_y]                      # motor 1
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40
endstop_pin: A_REMPLIR
position_endstop: 0
position_min: -200
position_max: 200

[stepper_z]                      # motor 2
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 8             # A_REMPLIR: lead screw pitch
endstop_pin: probe:z_virtual_endstop
position_min: -60
position_max: 200

[manual_stepper motor_u]         # motor 3
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40
velocity: 100
accel: 2000

[manual_stepper motor_v]         # motor 4
step_pin: A_REMPLIR
dir_pin: A_REMPLIR
enable_pin: !A_REMPLIR
microsteps: 16
rotation_distance: 40
velocity: 100
accel: 2000

# Call once at the start of every print (from START_PRINT), after homing.
[gcode_macro ARTPRINT_AXES]
gcode:
    MANUAL_STEPPER STEPPER=motor_u ENABLE=1
    MANUAL_STEPPER STEPPER=motor_v ENABLE=1
    MANUAL_STEPPER STEPPER=motor_u GCODE_AXIS=U LIMIT_VELOCITY=300 LIMIT_ACCEL=3000
    MANUAL_STEPPER STEPPER=motor_v GCODE_AXIS=V LIMIT_VELOCITY=300 LIMIT_ACCEL=3000
